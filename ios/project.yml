# Genera el proyecto de Xcode con XcodeGen. No necesitas un Mac: Codemagic lo ejecuta (ver codemagic.yaml).
name: MomentoEstacion
options:
  bundleIdPrefix: cl.momentoestudio
  deploymentTarget:
    iOS: "17.0"
targets:
  MomentoEstacion:
    type: application
    platform: iOS
    sources: [MomentoEstacion]
    scheme: {}                              # esquema compartido, necesario para compilar sin Xcode abierto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cl.momentoestudio.estacion
        TARGETED_DEVICE_FAMILY: "2"          # solo iPad
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Momento Estudio"
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO   # solo HTTPS estándar: evita la pregunta de cifrado en cada envío
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        VERSIONING_SYSTEM: apple-generic
        CODE_SIGN_STYLE: Manual
