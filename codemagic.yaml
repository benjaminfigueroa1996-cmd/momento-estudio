# Compila la app del iPad en un Mac de Codemagic y la envía a TestFlight.
# No requiere Mac propio. Se activa al hacer push a main con cambios en ios/.
workflows:
  estacion-ipad:
    name: Estación iPad → TestFlight
    max_build_duration: 45
    instance_type: mac_mini_m2              # incluido en los 500 minutos gratis mensuales de cuentas personales
    integrations:
      app_store_connect: Momento Estudio    # nombre que le pongas a la clave de API en Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: cl.momentoestudio.estacion
      vars:
        APP_ID: "0000000000"                # Apple ID numérico de la app en App Store Connect (Información de la app)
      xcode: latest
    triggering:
      events: [push]
      branch_patterns:
        - pattern: main
    when:
      changeset:
        includes: ["ios/"]
    scripts:
      - name: Generar el proyecto de Xcode
        script: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: Aplicar perfiles de firma
        script: xcode-project use-profiles --project ios/MomentoEstacion.xcodeproj
      - name: Número de compilación
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_ID" || echo 0)
          cd ios && agvtool new-version -all $((LATEST + 1))
      - name: Compilar
        script: |
          xcode-project build-ipa \
            --project ios/MomentoEstacion.xcodeproj \
            --scheme MomentoEstacion
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
